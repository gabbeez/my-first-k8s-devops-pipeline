# Production Deployment for VS Code Web App


apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: vscode-web
  template:
    metadata:
      labels:
        app: vscode-web
    spec:
      containers:
      - name: web-container
        image: nginx:alpine
        ports:
        - containerPort: 80
